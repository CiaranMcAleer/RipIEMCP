name: Security and Dependencies

on:
  schedule:
    # Run monthly on the 1st at 8 AM GMT
    - cron: '0 8 1 * *'
  push:
    branches: [ main ]
    paths:
      - 'requirements.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'requirements.txt'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install safety bandit

    - name: Run safety check on dependencies
      run: |
        echo "Checking for known security vulnerabilities in dependencies..."
        safety check --json || true

    - name: Run bandit security scan
      run: |
        echo "Running static security analysis..."
        bandit -r rip-ie-server/ -f json -o bandit-report.json || true
        
        # Show results in a readable format
        bandit -r rip-ie-server/ || true

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
        retention-days: 30

  dependency-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Check for outdated dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pip-audit
        
        echo "## Dependency Check Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check for outdated packages
        echo "### Outdated Packages" >> $GITHUB_STEP_SUMMARY
        pip list --outdated --format=columns || echo "All packages up to date" >> $GITHUB_STEP_SUMMARY
        
        # Audit for known vulnerabilities
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Security Audit" >> $GITHUB_STEP_SUMMARY
        pip-audit --format=markdown --output=audit-report.md || true
        
        if [ -f audit-report.md ]; then
          cat audit-report.md >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ No known vulnerabilities found" >> $GITHUB_STEP_SUMMARY
        fi

  validate-requirements:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.7', '3.8', '3.9', '3.10', '3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Validate requirements.txt
      run: |
        echo "Validating requirements.txt for Python ${{ matrix.python-version }}"
        python -m pip install --upgrade pip
        
        # Try to install all requirements
        pip install -r requirements.txt
        
        # Verify imports work
        python -c "import requests; print(f'requests version: {requests.__version__}')"
        
        echo "✅ Requirements valid for Python ${{ matrix.python-version }}"